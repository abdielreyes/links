server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip_static on;

    # YouTube RSS proxy — avoids CORS entirely
    location /api/yt-feed {
        resolver 1.1.1.1 8.8.8.8 valid=30s;
        proxy_pass https://www.youtube.com/feeds/videos.xml$is_args$args;
        proxy_set_header Host www.youtube.com;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        add_header Cache-Control "max-age=300";
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite adds content hashes)
    location ~* \.(?:js|css|woff2?|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No cache for index.html
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
